name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  TAGS: with_gvisor,with_utls,badlinkname,tfogo_checklinkname0,reka_minimal
  LDFLAGS: -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0

jobs:
  reference:
    name: test (pinned compatibility reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/mihomodiff/go.mod
          cache-dependency-path: tools/mihomodiff/go.sum
      - name: Rule and observed policy differential
        working-directory: tools/mihomodiff
        run: go run .
      - name: Reference units and encrypted VLESS transport
        working-directory: tools/mihomodiff
        run: go test -race ./...
      - name: Build unmodified reference plugin peer
        working-directory: tools/mihomodiff
        run: |
          mkdir -p ../../bin
          go build -o ../../bin/referencepeer ./referencepeer
      - name: Native SS plugins against reference peers
        run: |
          python3 tools/build-overlay.py
          CGO_ENABLED=1 REKA_REFERENCE_PEER="$GITHUB_WORKSPACE/bin/referencepeer" go test -modfile bin/build.mod -overlay bin/build-overlay.json -race -tags "$TAGS" -ldflags "$LDFLAGS" ./internal/backend/sagernet -run '^TestSSPluginsAgainstPinnedReference$' -count=3

  # Jobs named "test" run the tests on that platform; jobs named "build"
  # only compile.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pinned build overlay
        run: |
          python3 tools/build-overlay.py
          echo 'GOFLAGS=-modfile=bin/build.mod -overlay=bin/build-overlay.json' >> "$GITHUB_ENV"
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
      - name: packages
        # The Android probe and JNI binding need the NDK; they are built
        # in the android job.
        run: echo "PKGS=$(go list ./... | grep -v -e /tools/tunprobe-android/ -e /mobile/jni | tr '\n' ' ')" >> "$GITHUB_ENV"
      - name: vet
        run: go vet -tags "$TAGS" $PKGS
      - name: test
        env:
          CGO_ENABLED: "0"
        run: go test -tags "$TAGS" -ldflags "$LDFLAGS" $PKGS
      - name: Cross-UID filesystem and peer credential rejection
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          stage=$(mktemp -d /tmp/reka-peer-ci.XXXXXX)
          trap 'sudo rm -rf "$stage"' EXIT
          chmod 755 "$stage"
          go build -tags "$TAGS" -ldflags "$LDFLAGS" -o "$stage/peersmoke" ./tools/peersmoke
          chmod 755 "$stage/peersmoke"
          sudo "$stage/peersmoke" -owner "$(id -u)" -negative 65534 -output "$stage/result.json"
          mkdir -p bin
          sudo cat "$stage/result.json" | tee bin/peer-credentials.json

  race:
    name: test (race, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pinned build overlay
        run: |
          python3 tools/build-overlay.py
          echo 'GOFLAGS=-modfile=bin/build.mod -overlay=bin/build-overlay.json' >> "$GITHUB_ENV"
      - name: race
        # Pinned overlays cover Vision and SOCKS UDP without race exemptions.
        env:
          CGO_ENABLED: "1"
        run: |
          PKGS=$(go list ./... | grep -v -e /tools/tunprobe-android/ -e /mobile/jni)
          go test -race -tags "$TAGS" -ldflags "$LDFLAGS" $PKGS

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pinned build overlay
        run: |
          python3 tools/build-overlay.py
          echo 'GOFLAGS=-modfile=bin/build.mod -overlay=bin/build-overlay.json' >> "$GITHUB_ENV"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -tags "$TAGS" -ldflags "$LDFLAGS -s -w" -o out/ ./cmd/reka ./cmd/rekactl
          go vet -tags "$TAGS" $(go list ./... | grep -v -e /tools/tunprobe-android/ -e /mobile/jni)
          ls -l out

  android:
    name: build (android/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: pinned build overlay
        run: |
          python3 tools/build-overlay.py
          echo 'GOFLAGS=-modfile=bin/build.mod -overlay=bin/build-overlay.json' >> "$GITHUB_ENV"
      - name: libreka.so
        run: |
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" go build -trimpath -buildmode=c-shared \
            -tags "$TAGS" -ldflags "$LDFLAGS -s -w" -o out/libreka.so ./mobile/jni
          ls -l out/libreka.so
      - name: Compile public Kotlin wrapper and acceptance app
        run: mobile/android/build.sh
