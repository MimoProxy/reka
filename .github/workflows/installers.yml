name: windows installers

on:
  # Every pull request reports the required installer checks. Those without
  # installer inputs finish them without building.
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (does not publish a release)
        default: 1.0.0-dev
        required: true
        type: string

permissions:
  contents: read

env:
  REKA_PACKAGE_VERSION: ${{ inputs.version || '1.0.0-dev' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.inputs.outputs.build }}
    steps:
      - name: Detect installer inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          pattern='^(packaging/windows/|cmd/|internal/)|^(tools/release\.py|tools/build-overlay\.py|tools/windows-installer-runtime\.ps1|\.github/workflows/installers\.yml|go\.mod|go\.sum)$'
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi

  installer:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, arch: amd64, inno_arch: x64compatible}
          - {os: windows-11-arm, arch: arm64, inno_arch: arm64}
    # The matrix always expands so the check names stay those branch protection
    # requires. Without installer inputs the job runs no steps on a Linux runner.
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BUILD: ${{ needs.changes.outputs.build }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: No installer inputs changed
        if: env.BUILD != 'true'
        shell: bash
        run: echo "This pull request does not change installer inputs."
      - name: Preserve exact source bytes
        if: env.BUILD == 'true'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
      - uses: actions/setup-go@v5
        if: env.BUILD == 'true'
        with:
          go-version-file: go.mod
      - name: Stage unsigned distribution
        if: env.BUILD == 'true'
        run: python3 tools/release.py --version "$env:REKA_PACKAGE_VERSION" --targets windows/${{ matrix.arch }} --output bin/ci-windows
      - name: Verify official compiler and build installer
        if: env.BUILD == 'true'
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $version=$env:REKA_PACKAGE_VERSION
          if($version -notmatch '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,79}$'){throw 'Invalid package version'}
          $root=Join-Path $PWD 'bin\ci-windows'
          $download=Join-Path $root 'innosetup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          if((Get-FileHash $download -Algorithm SHA256).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C'){throw 'Compiler hash mismatch'}
          $signature=Get-AuthenticodeSignature $download
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys'){throw 'Compiler signature mismatch'}
          $tools=Join-Path $root 'compiler'
          $process=Start-Process $download -ArgumentList @('/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="'+$tools+'"'),'/MERGETASKS=!fileassoc') -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Compiler installation failed'}
          $source=Join-Path $root ("$version\reka-$version-windows-${{ matrix.arch }}")
          & (Join-Path $tools 'ISCC.exe') ('/DSourceRoot='+$source) ('/DAppVersion='+$version) '/DTargetArch=${{ matrix.inno_arch }}' ('/O'+(Join-Path $root 'installer-${{ matrix.arch }}')) (Join-Path $source 'packaging\windows\reka.iss')
          if($LASTEXITCODE -ne 0){throw 'Installer compilation failed'}
          $installer=Join-Path $root ("installer-${{ matrix.arch }}\reka-$version-setup.exe")
          ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+[IO.Path]::GetFileName($installer))|Set-Content -Encoding ASCII (Join-Path $root 'installer-SHA256SUMS')
      - name: Install, upgrade, owner access and uninstall
        if: env.BUILD == 'true'
        run: |
          $ErrorActionPreference='Stop'
          ./tools/windows-installer-runtime.ps1 -Root (Join-Path $PWD 'bin\ci-windows') -Arch '${{ matrix.arch }}' -Version $env:REKA_PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        if: always() && env.BUILD == 'true'
        with:
          name: unsigned-windows-${{ matrix.arch }}-installer
          path: |
            bin/ci-windows/installer-${{ matrix.arch }}/*.exe
            bin/ci-windows/installer-runtime.json
            bin/ci-windows/installer*.log
            bin/ci-windows/installer-SHA256SUMS
            bin/ci-windows/${{ env.REKA_PACKAGE_VERSION }}/reka-${{ env.REKA_PACKAGE_VERSION }}-source.tar.gz
            bin/ci-windows/${{ env.REKA_PACKAGE_VERSION }}/reka-${{ env.REKA_PACKAGE_VERSION }}-windows-${{ matrix.arch }}/BUILD.json
